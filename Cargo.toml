[package]
name = "dally-eval"
version = "0.1.0"
edition = "2021"
description = "High-throughput evaluator for Bill Dally 2D Manhattan communication-cost IR programs"
license = "MIT"
repository = "https://github.com/cybertronai/dally-eval"
homepage = "https://github.com/cybertronai/dally-eval"
documentation = "https://github.com/cybertronai/dally-eval#readme"
readme = "README.md"
keywords = ["interpreter", "benchmark", "wgpu", "rayon", "ir"]
categories = ["science", "command-line-utilities"]

[lib]
name = "dally_eval"
path = "src/lib.rs"

[[bin]]
name = "dally-eval"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
bytemuck = { version = "1", features = ["derive"] }
cubecl = "0.10.0"
cubecl-wgpu = "0.10.0"
cubecl-runtime = "0.10"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "gpu-throughput"
harness = false

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
